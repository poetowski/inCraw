[project]
name = "incraw"
version = "0.1.0"
description = "Check LinkedIn profiles for a public Open to Work signal."
requires-python = ">=3.11"
dependencies = ["playwright>=1.48", "flask>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
incraw = "incraw.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
